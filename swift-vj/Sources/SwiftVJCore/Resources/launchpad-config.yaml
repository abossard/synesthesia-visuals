    - x: 7
      y: 0
      mode: oneShot
      label: "Favslot 4"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/favslots/4" }

  programmableRows: []  # Dynamic scenes overwrite pad map
  recordableRows: []
  pagingRows: [1, 2, 3, 4, 5, 6]
  presetsRow: null

# ============================================================================
# BANK 1: SYNESTHESIA
# ============================================================================
# Example: Scene selectors on row 7, preset controls on row 6, 
# intensity/speed controls on row 5

bank1:
  name: "Presets"
  purpose: "Scene presets"
  role: presets
  
  pads:
    # Row 7: Scene selection (dynamic group populated at runtime)
    # These will show scene names from Synesthesia when connected
    - { x: 0, y: 7, mode: selector, group: scenes, index: 0, idleColor: purpleDim, activeColor: purple }
    - { x: 1, y: 7, mode: selector, group: scenes, index: 1, idleColor: purpleDim, activeColor: purple }
    - { x: 2, y: 7, mode: selector, group: scenes, index: 2, idleColor: purpleDim, activeColor: purple }
    - { x: 3, y: 7, mode: selector, group: scenes, index: 3, idleColor: purpleDim, activeColor: purple }
    - { x: 4, y: 7, mode: selector, group: scenes, index: 4, idleColor: purpleDim, activeColor: purple }
    - { x: 5, y: 7, mode: selector, group: scenes, index: 5, idleColor: purpleDim, activeColor: purple }
    - { x: 6, y: 7, mode: selector, group: scenes, index: 6, idleColor: purpleDim, activeColor: purple }
    - { x: 7, y: 7, mode: selector, group: scenes, index: 7, idleColor: purpleDim, activeColor: purple }

    # Row 6: Preset selection (resets when scene changes)
    - { x: 0, y: 6, mode: selector, group: presets, index: 0, idleColor: cyanDim, activeColor: cyan }
    - { x: 1, y: 6, mode: selector, group: presets, index: 1, idleColor: cyanDim, activeColor: cyan }
    - { x: 2, y: 6, mode: selector, group: presets, index: 2, idleColor: cyanDim, activeColor: cyan }
    - { x: 3, y: 6, mode: selector, group: presets, index: 3, idleColor: cyanDim, activeColor: cyan }
    - { x: 4, y: 6, mode: selector, group: presets, index: 4, idleColor: cyanDim, activeColor: cyan }
    - { x: 5, y: 6, mode: selector, group: presets, index: 5, idleColor: cyanDim, activeColor: cyan }
    - { x: 6, y: 6, mode: selector, group: presets, index: 6, idleColor: cyanDim, activeColor: cyan }
    - { x: 7, y: 6, mode: selector, group: presets, index: 7, idleColor: cyanDim, activeColor: cyan }

    # Row 5: Global controls
    - x: 0
      y: 5
      mode: toggle
      label: "Freeze"
      idleColor: blueDim
      activeColor: blue
      oscOn:  { address: "/synesthesia/freeze", args: [1] }
      oscOff: { address: "/synesthesia/freeze", args: [0] }

    - x: 2
      y: 5
      mode: oneShot
      label: "Prev Scene"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/synesthesia/scene/previous" }

    - x: 3
      y: 5
      mode: oneShot
      label: "Next Scene"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/synesthesia/scene/next" }

    - x: 5
      y: 5
      mode: oneShot
      label: "Prev Preset"
      idleColor: cyan
      activeColor: cyanDim
      osc: { address: "/synesthesia/preset/previous" }

    - x: 6
      y: 5
      mode: oneShot
      label: "Next Preset"
      idleColor: cyan
      activeColor: cyanDim
      osc: { address: "/synesthesia/preset/next" }

    - x: 7
      y: 5
      mode: toggle
      label: "Auto Preset"
      idleColor: orangeDim
      activeColor: orange
      oscOn:  { address: "/synesthesia/autoPreset", args: [1] }
      oscOff: { address: "/synesthesia/autoPreset", args: [0] }

  programmableRows: [0, 1, 2, 3, 4]
  recordableRows: []
  pagingRows: [1, 2, 3, 4, 5, 6]
  presetsRow: 0

# ============================================================================
# BANK 2: MAGIC
# ============================================================================
# Example: Layer opacity controls, effect toggles, crossfader

bank2:
  name: "Global"
  purpose: "Global effects"
  role: global
  pads:
    # Row 7: Scene selection (dynamic group populated at runtime)
    - { x: 0, y: 7, mode: selector, group: scenes, index: 8, idleColor: purpleDim, activeColor: purple }
    - { x: 1, y: 7, mode: selector, group: scenes, index: 9, idleColor: purpleDim, activeColor: purple }
    - { x: 2, y: 7, mode: selector, group: scenes, index: 10, idleColor: purpleDim, activeColor: purple }
    - { x: 3, y: 7, mode: selector, group: scenes, index: 11, idleColor: purpleDim, activeColor: purple }
    - { x: 4, y: 7, mode: selector, group: scenes, index: 12, idleColor: purpleDim, activeColor: purple }
    - { x: 5, y: 7, mode: selector, group: scenes, index: 13, idleColor: purpleDim, activeColor: purple }
    - { x: 6, y: 7, mode: selector, group: scenes, index: 14, idleColor: purpleDim, activeColor: purple }
    - { x: 7, y: 7, mode: selector, group: scenes, index: 15, idleColor: purpleDim, activeColor: purple }
  programmableRows: [0, 1, 2, 3, 4, 5, 6]
  recordableRows: []
  pagingRows: [1, 2, 3, 4, 5, 6]
  presetsRow: null

# ============================================================================
# BANK 3: PROCESSING
# ============================================================================
# Example: VJUniverse tile controls, game launchers

bank3:
  name: "Favorites"
  purpose: "Quick access favorites"
  role: favorites
  pads: []
  programmableRows: [0, 1, 2, 3, 4, 5, 6, 7]
  recordableRows: []
  pagingRows: [1, 2, 3, 4, 5, 6]
  presetsRow: null

# ============================================================================
# BANK 4: EFFECTS
# ============================================================================
# Example: Post-processing effects with toggle controls

bank4:
  name: "Shaders"
  purpose: "VJUniverse shader selection"
  role: shaders
  
  pads:
    # Row 7: Primary effects
    - x: 0
      y: 7
      mode: toggle
      label: "Bloom"
      idleColor: pinkDim
      activeColor: pink
      oscOn:  { address: "/fx/bloom", args: [1] }
      oscOff: { address: "/fx/bloom", args: [0] }

    - x: 1
      y: 7
      mode: toggle
      label: "Blur"
      idleColor: blueDim
      activeColor: blue
      oscOn:  { address: "/fx/blur", args: [1] }
      oscOff: { address: "/fx/blur", args: [0] }

    - x: 2
      y: 7
      mode: toggle
      label: "Sharpen"
      idleColor: greenDim
      activeColor: green
      oscOn:  { address: "/fx/sharpen", args: [1] }
      oscOff: { address: "/fx/sharpen", args: [0] }

    - x: 3
      y: 7
      mode: toggle
      label: "Edge"
      idleColor: cyanDim
      activeColor: cyan
      oscOn:  { address: "/fx/edge", args: [1] }
      oscOff: { address: "/fx/edge", args: [0] }

    - x: 4
      y: 7
      mode: toggle
      label: "Invert"
      idleColor: yellowDim
      activeColor: yellow
      oscOn:  { address: "/fx/invert", args: [1] }
      oscOff: { address: "/fx/invert", args: [0] }

    - x: 5
      y: 7
      mode: toggle
      label: "Mirror"
      idleColor: purpleDim
      activeColor: purple
      oscOn:  { address: "/fx/mirror", args: [1] }
      oscOff: { address: "/fx/mirror", args: [0] }

    - x: 6
      y: 7
      mode: toggle
      label: "Kaleid"
      idleColor: magenta
      activeColor: white
      oscOn:  { address: "/fx/kaleidoscope", args: [1] }
      oscOff: { address: "/fx/kaleidoscope", args: [0] }

    - x: 7
      y: 7
      mode: oneShot
      label: "Reset FX"
      idleColor: redDim
      activeColor: red
      osc: { address: "/fx/reset" }

    # Row 6: Flash/strobe effects (push = momentary)
    - x: 0
      y: 6
      mode: push
      label: "Flash White"
      idleColor: white
      activeColor: white
      oscOn:  { address: "/fx/flash", args: [1.0, 1.0, 1.0] }
      oscOff: { address: "/fx/flash", args: [0.0, 0.0, 0.0] }

    - x: 1
      y: 6
      mode: push
      label: "Flash Red"
      idleColor: red
      activeColor: redBright
      oscOn:  { address: "/fx/flash", args: [1.0, 0.0, 0.0] }
      oscOff: { address: "/fx/flash", args: [0.0, 0.0, 0.0] }

    - x: 2
      y: 6
      mode: push
      label: "Flash Blue"
      idleColor: blue
      activeColor: blueBright
      oscOn:  { address: "/fx/flash", args: [0.0, 0.0, 1.0] }
      oscOff: { address: "/fx/flash", args: [0.0, 0.0, 0.0] }

    - x: 3
      y: 6
      mode: toggle
      label: "Strobe"
      idleColor: yellowDim
      activeColor: yellow
      oscOn:  { address: "/fx/strobe", args: [1] }
      oscOff: { address: "/fx/strobe", args: [0] }

  programmableRows: [0, 1, 2, 3, 4, 5]
  recordableRows: []
  pagingRows: [1, 2, 3, 4, 5, 6]
  presetsRow: null

