# Launchpad Mini Mk3 Configuration
# SwiftVJ - Complete layout and behavior definition
#
# STRUCTURE:
#   - colors: Named color palette
#   - groups: Selector groups with items (user lists or system references)
#   - global: Fixed buttons across all banks (record, shift, bank switches)
#   - banks: 8 banks (0-7), each with fixed and/or programmable pads
#
# PAD MODES:
#   oneShot  - Single trigger on press, sends osc
#   toggle   - On/Off, alternates between oscOn/oscOff
#   selector - Radio button within group, one active at a time
#   push     - Momentary, sends oscOn on press, oscOff on release

version: 1

# ============================================================================
# COLOR PALETTE
# ============================================================================

colors:
  off: 0
  white: 3
  grey: 1
  red: 5
  redDim: 1
  redBright: 6
  orange: 9
  orangeDim: 7
  yellow: 13
  yellowDim: 11
  yellowBright: 14
  green: 21
  greenDim: 19
  greenBright: 22
  cyan: 37
  cyanDim: 35
  blue: 45
  blueDim: 41
  blueBright: 46
  purple: 53
  purpleDim: 51
  pink: 57
  pinkDim: 55
  magenta: 61

# ============================================================================
# SELECTOR GROUPS
# ============================================================================
# Groups define mutually exclusive selections. Items can be:
# - A static list of strings (user data like playlist names)
# - A reference to dynamic system data ($scenes, $presets, etc.)

groups:
  playlists:
    type: static
    items:
      - "Chill Vibes"
      - "High Energy"
      - "Ambient"
      - "Techno"
      - "House"
      - "Breaks"
      - "Experimental"
      - "Classics"

  scenes:
    type: dynamic
    source: "$synesthesia/scenes"  # Populated from Synesthesia at runtime

  presets:
    type: dynamic
    source: "$synesthesia/presets"
    parent: scenes  # Resets when parent group changes

# ============================================================================
# GLOBAL FIXED ELEMENTS
# ============================================================================
# These are the same across ALL banks and cannot be reprogrammed.

global:
  # Top row bank buttons (CC 91-98)
  bankButtons:
    - { cc: 91, bank: 0, name: "Playlist",    idleColor: blue,    activeColor: white }
    - { cc: 92, bank: 1, name: "Synesthesia", idleColor: purple,  activeColor: white }
    - { cc: 93, bank: 2, name: "Magic",       idleColor: cyan,    activeColor: white }
    - { cc: 94, bank: 3, name: "Processing",  idleColor: green,   activeColor: white }
    - { cc: 95, bank: 4, name: "Effects",     idleColor: orange,  activeColor: white }
    - { cc: 96, bank: 5, name: "Colors",      idleColor: pink,    activeColor: white }
    - { cc: 97, bank: 6, name: "Audio",       idleColor: yellow,  activeColor: white }
    - { cc: 98, bank: 7, name: "Custom",      idleColor: grey,    activeColor: white }

  # Scene column buttons (right side, notes 19, 29, 39, 49)
  sceneButtons:
    - { note: 19, function: page, label: "Page 1", idleColor: purpleDim, activeColor: purple }
    - { note: 29, function: page, label: "Page 2", idleColor: purpleDim, activeColor: purple }
    - { note: 39, function: page, label: "Page 3", idleColor: purpleDim, activeColor: purple }
    - { note: 49, function: page, label: "Page 4", idleColor: purpleDim, activeColor: purple }

# ============================================================================
# BANK 0: PLAYLIST CONTROL
# ============================================================================

bank0:
  name: "Playlist"
  purpose: "Playlist selection and playback"

  pads:
    # Row 7: Playlist selection (uses 'playlists' group)
    - { x: 0, y: 7, mode: selector, group: playlists, index: 0, idleColor: blueDim, activeColor: blue }
    - { x: 1, y: 7, mode: selector, group: playlists, index: 1, idleColor: blueDim, activeColor: blue }
    - { x: 2, y: 7, mode: selector, group: playlists, index: 2, idleColor: blueDim, activeColor: blue }
    - { x: 3, y: 7, mode: selector, group: playlists, index: 3, idleColor: blueDim, activeColor: blue }
    - { x: 4, y: 7, mode: selector, group: playlists, index: 4, idleColor: blueDim, activeColor: blue }
    - { x: 5, y: 7, mode: selector, group: playlists, index: 5, idleColor: blueDim, activeColor: blue }
    - { x: 6, y: 7, mode: selector, group: playlists, index: 6, idleColor: blueDim, activeColor: blue }
    - { x: 7, y: 7, mode: selector, group: playlists, index: 7, idleColor: blueDim, activeColor: blue }

    # Row 6: Playback controls
    - x: 0
      y: 6
      mode: toggle
      label: "Play"
      idleColor: greenDim
      activeColor: green
      oscOn:  { address: "/playlist/play", args: [1] }
      oscOff: { address: "/playlist/play", args: [0] }

    - x: 2
      y: 6
      mode: oneShot
      label: "Previous"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/playlist/previous" }

    - x: 4
      y: 6
      mode: oneShot
      label: "Next"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/playlist/next" }

    - x: 6
      y: 6
      mode: toggle
      label: "Shuffle"
      idleColor: purpleDim
      activeColor: purple
      oscOn:  { address: "/playlist/shuffle", args: [1] }
      oscOff: { address: "/playlist/shuffle", args: [0] }

    - x: 7
      y: 6
      mode: toggle
      label: "Auto"
      idleColor: orangeDim
      activeColor: orange
      oscOn:  { address: "/playlist/auto", args: [1] }
      oscOff: { address: "/playlist/auto", args: [0] }

  programmableRows: [0, 1, 2, 3, 4, 5]

# ============================================================================
# BANK 1: SYNESTHESIA
# ============================================================================
# Example: Scene selectors on row 7, preset controls on row 6, 
# intensity/speed controls on row 5

bank1:
  name: "Synesthesia"
  purpose: "Scene and preset control"
  
  pads:
    # Row 7: Scene selection (dynamic group populated at runtime)
    # These will show scene names from Synesthesia when connected
    - { x: 0, y: 7, mode: selector, group: scenes, index: 0, idleColor: purpleDim, activeColor: purple }
    - { x: 1, y: 7, mode: selector, group: scenes, index: 1, idleColor: purpleDim, activeColor: purple }
    - { x: 2, y: 7, mode: selector, group: scenes, index: 2, idleColor: purpleDim, activeColor: purple }
    - { x: 3, y: 7, mode: selector, group: scenes, index: 3, idleColor: purpleDim, activeColor: purple }
    - { x: 4, y: 7, mode: selector, group: scenes, index: 4, idleColor: purpleDim, activeColor: purple }
    - { x: 5, y: 7, mode: selector, group: scenes, index: 5, idleColor: purpleDim, activeColor: purple }
    - { x: 6, y: 7, mode: selector, group: scenes, index: 6, idleColor: purpleDim, activeColor: purple }
    - { x: 7, y: 7, mode: selector, group: scenes, index: 7, idleColor: purpleDim, activeColor: purple }

    # Row 6: Preset selection (resets when scene changes)
    - { x: 0, y: 6, mode: selector, group: presets, index: 0, idleColor: cyanDim, activeColor: cyan }
    - { x: 1, y: 6, mode: selector, group: presets, index: 1, idleColor: cyanDim, activeColor: cyan }
    - { x: 2, y: 6, mode: selector, group: presets, index: 2, idleColor: cyanDim, activeColor: cyan }
    - { x: 3, y: 6, mode: selector, group: presets, index: 3, idleColor: cyanDim, activeColor: cyan }
    - { x: 4, y: 6, mode: selector, group: presets, index: 4, idleColor: cyanDim, activeColor: cyan }
    - { x: 5, y: 6, mode: selector, group: presets, index: 5, idleColor: cyanDim, activeColor: cyan }
    - { x: 6, y: 6, mode: selector, group: presets, index: 6, idleColor: cyanDim, activeColor: cyan }
    - { x: 7, y: 6, mode: selector, group: presets, index: 7, idleColor: cyanDim, activeColor: cyan }

    # Row 5: Global controls
    - x: 0
      y: 5
      mode: toggle
      label: "Freeze"
      idleColor: blueDim
      activeColor: blue
      oscOn:  { address: "/synesthesia/freeze", args: [1] }
      oscOff: { address: "/synesthesia/freeze", args: [0] }

    - x: 2
      y: 5
      mode: oneShot
      label: "Prev Scene"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/synesthesia/scene/previous" }

    - x: 3
      y: 5
      mode: oneShot
      label: "Next Scene"
      idleColor: yellow
      activeColor: yellowBright
      osc: { address: "/synesthesia/scene/next" }

    - x: 5
      y: 5
      mode: oneShot
      label: "Prev Preset"
      idleColor: cyan
      activeColor: cyanDim
      osc: { address: "/synesthesia/preset/previous" }

    - x: 6
      y: 5
      mode: oneShot
      label: "Next Preset"
      idleColor: cyan
      activeColor: cyanDim
      osc: { address: "/synesthesia/preset/next" }

    - x: 7
      y: 5
      mode: toggle
      label: "Auto Preset"
      idleColor: orangeDim
      activeColor: orange
      oscOn:  { address: "/synesthesia/autoPreset", args: [1] }
      oscOff: { address: "/synesthesia/autoPreset", args: [0] }

  programmableRows: [0, 1, 2, 3, 4]

